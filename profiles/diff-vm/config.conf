# Hồ sơ mẫu: KHÁC VM (mô hình B trong tài liệu). Hệ thống chạy trên VM SBC; PBX ở VM khác và được thay cert qua SSH tới pbx-agent.sh.
# Cert nguồn (Caddy, lego hoặc dán tay) cũng nằm trên VM SBC. Sửa mọi giá trị có TODO.
# KHÔNG đặt mật khẩu ở đây (sbc.cred và telegram.conf nằm riêng, quyền 600).

DOMAIN="pbx.example.com"                 # TODO: domain/SAN của cert, cũng là SNI đo cổng PBX
CADDY_CERT_BASE="/var/lib/caddy/.local/share/caddy"     # hoặc /var/lib/cert-drop nếu dán tay bằng paste-cert.sh

# ---- PBX (VM KHÁC): thay cert qua SSH tới pbx-agent.sh, đo cổng qua mạng ----
# Đường dẫn file cert, chủ file và container cần restart nằm trong /etc/pbx-cert-agent.conf TRÊN VM PBX, không đặt ở đây.
PBX_SSH="root@10.0.0.1"                                  # TODO: tài khoản và IP của VM PBX
PBX_SSH_KEY="/etc/caddy-cert-sync/pbx_ssh_key"
PBX_SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/caddy-cert-sync/known_hosts"
PBX_PORTS="10.0.0.1:8887"                                # TODO: đổi IP; VM SBC phải vào được cổng này

# ---- SBC (VM NÀY): API ở 127.0.0.1 ----
SBC_API_BASE="https://127.0.0.1:8883/sbc/api"
SBC_TOKEN_JQ='.["access-token"]'
SBC_TLS_DOMAIN="$DOMAIN"
SBC_WEB_DOMAIN=true
SBC_DELETE_FIRST=true
SBC_FALLBACK_RESTART="nginx"
SBC_PORTS="8883 10443 5065 5067"

# ---- Khung giờ, thử lại, trạng thái, nhật ký ----
WINDOW_START=22
WINDOW_END=5
MAX_AUTO_ATTEMPTS=2                      # số lần tự thử tối đa cho mỗi cert; hết lượt thì dừng và cảnh báo
STATE_DIR="/var/lib/caddy-cert-sync"
LOG="/var/log/caddy-cert-sync.log"
EXPIRY_ALERT_DAYS="30 14 7 3 1"
