name: Image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tag phải khớp VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Đăng nhập GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Dựng và đẩy image
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -f container/Dockerfile -t "$IMG:${GITHUB_REF_NAME}" .
          docker push "$IMG:${GITHUB_REF_NAME}"
