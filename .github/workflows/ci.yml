name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Script phải có quyền thực thi trong Git (mode 100755)
        run: |
          bad=0
          for f in $(git ls-files 'bin/*.sh' | grep -v '/lib-') install.sh container/entrypoint.sh; do
            mode=$(git ls-files --stage -- "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then echo "THIẾU quyền thực thi: $f (mode ${mode:-không có trong Git})"; bad=1; fi
          done
          if [ "$bad" = 1 ]; then
            echo "Sửa trên máy phát triển: git update-index --chmod=+x <tệp>, rồi commit và push."
            echo "(Git trên Windows ghi mọi tệp với quyền 644 nếu không chạy lệnh trên.)"
            exit 1
          fi
      - name: Cài công cụ
        run: sudo apt-get update && sudo apt-get install -y jq inotify-tools shellcheck
      - name: Kiểm tra cú pháp và shellcheck mức lỗi
        run: make lint
      - name: Chạy bộ kiểm thử
        run: make test
      - name: Thử đóng gói (gói đầy đủ, gói agent, tarball, checksum)
        run: make release
      - name: Thử dựng image
        run: make image
